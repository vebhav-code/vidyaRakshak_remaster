<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidya Rakshak Meta Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('image2.png');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      position: relative;
    }

    .frosted-glass {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 10;
    }

    .modal-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      z-index: 50;
    }
    .modal-container.visible {
      opacity: 1; pointer-events: auto;
    }

    .form-card {
      width: 90%; max-width: 400px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s ease-in-out;
      position: relative;
    }
    .modal-container.visible .form-card {
      transform: scale(1);
    }

    .form-card input {
      background: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      width: 100%;
      transition: background 0.3s ease;
    }
    .form-card input:focus {
      background: rgba(255, 255, 255, 0.25); 
      outline: none;
      border-color: rgba(0, 0, 0, 0.3);
    }

    .message-box {
      position: fixed;
      top: 2rem; right: 2rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
      transform: translateX(120%);
      opacity: 0;
      z-index: 100;
      color: white;
    }
    .message-box.show {
      transform: translateX(0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-[#4F6F52]">
  <div class="frosted-glass p-8 w-[95%] max-w-5xl text-white flex flex-col md:flex-row items-center justify-between">
    <div class="p-8">
      <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight mb-4 text-gray-900">
        Vidya Rakshak Meta Study
      </h1>
      <p class="text-gray-700 mb-6 max-w-lg">
        Vidya Rakshak is a comprehensive meta-study analyzing the impact of digital tools on student academic and mental well-being across various educational settings.
      </p>
      <button id="openModalBtn" class="bg-white text-gray-800 font-semibold py-3 px-6 rounded-full shadow-lg hover:bg-gray-100 transition-all duration-300">
        Login/Sign Up
      </button>
    </div>

    <!-- Right-side Image -->
    <div class="mt-8 md:mt-0 md:ml-8 flex justify-center">
      <img src="/static/image.png" 
           alt="Meta Study Illustration" 
           class="w-3/4 h-auto rounded-3xl object-cover shadow-2xl">
    </div>
  </div>

  <div id="modalContainer" class="modal-container">
    <div class="form-card frosted-glass text-gray-800">
      <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-600 hover:text-gray-800 transition-colors duration-200">
        ✕
      </button>

      <div id="loginForm">
        <h2 class="text-2xl font-bold mb-6 text-center">Login to your account</h2>
        <form id="loginFormElement" action="/login" method="POST">
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="loginEmail" name="email" required>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="loginPassword" name="password" required>
          </div>
          <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2.5 rounded-lg shadow-md hover:bg-green-700">Log In</button>
        </form>
        <p class="text-center text-sm mt-4">
          Don’t have an account? <a href="#" id="showSignupBtn" class="text-green-600 hover:underline font-semibold">Sign Up</a>
        </p>
      </div>

      <div id="signupForm" class="hidden">
        <h2 class="text-2xl font-bold mb-6 text-center">Create a new account</h2>
        <form id="signupFormElement" action="/signup" method="POST">
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">First Name</label>
            <input type="text" id="signupFirstName" name="first_name" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Last Name</label>
            <input type="text" id="signupLastName" name="last_name" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="signupEmail" name="email" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="signupPassword" name="password" required>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirm_password" required>
          </div>
          <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2.5 rounded-lg shadow-md hover:bg-green-700">Sign Up</button>
        </form>
        <p class="text-center text-sm mt-4">
          Already have an account? <a href="#" id="showLoginBtn" class="text-green-600 hover:underline font-semibold">Log In</a>
        </p>
      </div>
    </div>
  </div>

  <div id="messageBox" class="message-box"></div>

  <script>
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalContainer = document.getElementById('modalContainer');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const showSignupBtn = document.getElementById('showSignupBtn');
    const showLoginBtn = document.getElementById('showLoginBtn');
    const messageBox = document.getElementById('messageBox');

    function showMessage(msg, type = "success") {
      messageBox.textContent = msg;
      messageBox.className = "message-box show " + (type === "success" ? "bg-green-500" : "bg-red-500");
      setTimeout(() => messageBox.classList.remove("show"), 3000);
    }

    openModalBtn.addEventListener("click", () => modalContainer.classList.add("visible"));
    closeModalBtn.addEventListener("click", () => modalContainer.classList.remove("visible"));
    modalContainer.addEventListener("click", e => { if (e.target.id === "modalContainer") modalContainer.classList.remove("visible"); });

    showSignupBtn.addEventListener("click", e => { e.preventDefault(); loginForm.classList.add("hidden"); signupForm.classList.remove("hidden"); });
    showLoginBtn.addEventListener("click", e => { e.preventDefault(); signupForm.classList.add("hidden"); loginForm.classList.remove("hidden"); });

    // Flask flash messages example
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          showMessage("{{ message }}", "{{ category }}");
        {% endfor %}
      {% endif %}
    {% endwith %}
  </script>
</body>
</html>
